function copyTxt(x){try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(x);}catch(e){}toast(t('copied')+' '+x.slice(0,60));}
function rnd(n){const cs='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789',a=new Uint32Array(n);crypto.getRandomValues(a);let s='';for(let i=0;i<n;i++)s+=cs[a[i]%cs.length];return s;}
function norm(u){u=(u||'').trim();if(u&&!/^[a-z][a-z0-9+.-]*:\/\//i.test(u))u='https://'+u;try{const x=new URL(u);if(x.protocol!=='http:'&&x.protocol!=='https:')return '';return x.href;}catch(e){return '';}}
function base(){return location.origin+location.pathname;}
function scanURL(u){
const flags=[];let x;try{x=new URL(u);}catch(e){return {level:'bad',flags:['invalid']};}
const host=(x.hostname||'').toLowerCase();
if(x.protocol!=='https:')flags.push('fProto');
if(host.includes('xn--'))flags.push('fPuny');
if(/^\d+\.\d+\.\d+\.\d+$/.test(host)||/^\[.+\]$/.test(host))flags.push('fIp');
if(x.username||u.split('#')[0].indexOf('@')>u.indexOf('://')+2)flags.push('fAt');
if(x.port&&['80','443','8080','8443'].indexOf(x.port)<0)flags.push('fPort');
const tld=host.split('.').pop();
if(RISKY_TLD.indexOf(tld)>=0)flags.push('fTld');
if(host.split('.').length>4)flags.push('fSubs');
if(u.length>120)flags.push('fLong');
const low=u.toLowerCase();
if(KW.some(k=>low.includes(k)))flags.push('fKw');
if(/[?&](url|redirect|next|dest|destination|goto|continue)=https?/i.test(u))flags.push('fRedir');
if(/(bit\.ly|is\.gd|v\.gd|t\.co|tinyurl|goo\.gl|ow\.ly|cutt\.ly|shorturl)/i.test(host))flags.push('fShort');
let level='safe';
if(flags.includes('fPuny')||flags.includes('fIp')&&flags.includes('fKw')||flags.length>=4)level='bad';
else if(flags.length>=1)level='warn';
if(flags.includes('fIp')&&flags.length===1&&x.protocol==='https:')level='warn';
return {level,flags,host};
}
async function apiShort(provider,url){
if(provider==='isgd'||provider==='vgd'){const d=provider==='isgd'?'is.gd':'v.gd';
const r=await fetch('https://'+d+'/create.php?format=json&url='+encodeURIComponent(url));if(!r.ok)throw 0;
const j=await r.json();if(!j.shorturl)throw 0;return j.shorturl;}
if(provider==='cleanuri'){const r=await fetch('https://cleanuri.com/api/v1/shorten',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'url='+encodeURIComponent(url)});if(!r.ok)throw 0;
const j=await r.json();if(!j.result_url)throw 0;return j.result_url;}
throw 0;
}
function mkNative(url){
const code=rnd(6);const L=links();
if(L[code])return mkNative(url);
const exp=document.getElementById('linkExp').value;
L[code]={url,pass:document.getElementById('linkPass').value||'',exp:exp==='0'?0:Date.now()+ +exp*864e5,created:Date.now(),clicks:0};
setLinks(L);return base()+'#s='+code;
}
async function shorten(){
const url=norm(document.getElementById('longUrl').value);
if(!url){toast(t('badUrl'));return;}
const prov=document.getElementById('provSel').value;
const box=document.getElementById('shortRes');box.innerHTML='…';
const rec={long:url,time:new Date().toLocaleString()};
const done=(short,via)=>{rec.short=short;rec.via=via;const c=created();c.unshift(rec);setCreated(c.slice(0,200));renderEarn();
box.innerHTML=`<div class="res">🔗 <a target="_blank" rel="noopener" href="${short}">${short}</a><br><small style="color:var(--mut)">${via}</small><div class="row"><button class="alt" onclick="copyTxt('${short}')">${t('copied')}</button></div></div>`;toast(t('created'));};
if(prov==='vault'){done(mkNative(url),'LinkVault native');return;}
const order=prov==='auto'?['isgd','vgd','cleanuri']:[prov];
for(const p of order){try{const s=await apiShort(p,url);done(s,p);return;}catch(e){}}
done(mkNative(url),'LinkVault native · '+t('apiFail'));
}
function route(){
const h=location.hash||'';
if(h.startsWith('#s='))gateLink(h.slice(3));
else if(h.startsWith('#p='))gatePaste(h.slice(3));
else {document.getElementById('mainUI').style.display='';document.getElementById('gate').style.display='none';}
}
let gateTimer=null,gateOK='';
function gateLink(code){
code=String(code||'');
document.getElementById('mainUI').style.display='none';document.getElementById('gate').style.display='';
const B=document.getElementById('gateBody');
if(!/^[A-Za-z0-9]{1,16}$/.test(code)){B.innerHTML=`<div class="verdict v-bad">${t('notFound')}</div>`;return;}
const L=links(),it=L[code];
if(!it){B.innerHTML=`<div class="verdict v-bad">${t('notFound')}</div>`;return;}
if(it.exp&&Date.now()>it.exp){delete L[code];setLinks(L);B.innerHTML=`<div class="verdict v-bad">${t('expired')}</div>`;return;}
if(it.pass&&gateOK!==code){B.innerHTML=`<h3>🔐 LinkVault</h3><p>${t('needPass')}</p><div class="row" style="justify-content:center"><input type="password" id="gatePass"><button class="go" onclick="gateLink('${code}')">${t('goNow')}</button></div>`;return;}
if(it.pass){const v=(document.getElementById('gatePass')||{}).value||'';if(v!==it.pass){B.innerHTML=`<h3>🔐 LinkVault</h3><p>${t('wrongPass')}</p><div class="row" style="justify-content:center"><button class="alt" onclick="location.hash='';route()">${t('goBack')}</button></div>`;return;}}
gateOK=code;
const sc=scanURL(it.url);
const vc=sc.level==='safe'?'v-safe':sc.level==='warn'?'v-warn':'v-bad';
const vt=sc.level==='safe'?t('vSafe'):sc.level==='warn'?t('vWarn'):t('vBad');
B.innerHTML=`<h3>🔗 LinkVault</h3><div class="url">${it.url.slice(0,90)}</div><div class="verdict ${vc}">${vt}</div><div class="flags">${sc.flags.map(f=>`• ${t(f)}`).join('<br>')||'—'}</div><div class="count" id="cdN">${CONFIG.waitSec}</div><div>${t('waitL')}</div><div class="row" style="justify-content:center"><button class="alt" onclick="location.hash='';route()">${t('goBack')}</button></div>`;
let n=CONFIG.waitSec;clearInterval(gateTimer);
gateTimer=setInterval(()=>{n--;const el=document.getElementById('cdN');if(!el){clearInterval(gateTimer);return;}
if(n<=0){clearInterval(gateTimer);it.clicks=(it.clicks||0)+1;const L2=links();if(L2[code]){L2[code].clicks=it.clicks;setLinks(L2);}location.href=it.url;}else el.textContent=n;},1000);
}
function gatePaste(id){
id=String(id||'');
document.getElementById('mainUI').style.display='none';document.getElementById('gate').style.display='';
const B=document.getElementById('gateBody');
if(!/^[A-Za-z0-9]{1,16}$/.test(id)){B.innerHTML=`<div class="verdict v-bad">${t('notFound')}</div>`;return;}
const P=pastes(),it=P[id];
if(!it||(it.exp&&Date.now()>it.exp)){if(it){delete P[id];setPastes(P);}B.innerHTML=`<div class="verdict v-bad">${t('pasteGone')}</div>`;return;}
B.innerHTML=`<h3>📋 LinkVault paste</h3><div class="pasteview">${it.text.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div><div class="row" style="justify-content:center"><button class="alt" onclick="copyTxt(document.querySelector('.pasteview').textContent)">${t('copyBtn')}</button><button class="alt" onclick="location.hash='';route()">${t('goBack')}</button></div><small style="color:var(--mut)">${t('pasteBy')}: ${it.exp?new Date(it.exp).toLocaleString():'∞'}</small>`;
if(it.burn){delete P[id];setPastes(P);}
}
function makePaste(mode){
const txt=document.getElementById('pasteIn').value;
if(!txt.trim()){toast(t('needText'));return;}
if(mode==='global'){
fetch('https://paste.rs',{method:'POST',headers:{'Content-Type':'text/plain'},body:txt}).then(r=>{if(!r.ok)throw 0;return r.text();}).then(u=>{
u=u.trim();const c=created();c.unshift({long:'paste',short:u,via:'paste.rs',time:new Date().toLocaleString()});setCreated(c.slice(0,200));renderEarn();
document.getElementById('pasteRes').innerHTML=`<div class="res">🌍 <a target="_blank" rel="noopener" href="${u}">${u}</a><div class="row"><button class="alt" onclick="copyTxt('${u}')">${t('copied')}</button></div></div>`;toast(t('pubOk'));}).catch(()=>{saveLocalPaste();toast(t('pubFail'));});
return;}
saveLocalPaste();
}
function saveLocalPaste(){
const txt=document.getElementById('pasteIn').value;
const id=rnd(8),exp=document.getElementById('pasteExp').value;
const P=pastes();P[id]={text:txt.slice(0,20000),lang:document.getElementById('pasteLang').value,exp:exp==='0'?0:Date.now()+ +exp*1000,created:Date.now(),burn:document.getElementById('pasteBurn').checked};
setPastes(P);const link=base()+'#p='+id;
document.getElementById('pasteRes').innerHTML=`<div class="res">🔗 <a href="${link}">${link}</a><div class="row"><button class="alt" onclick="copyTxt('${link}')">${t('copied')}</button></div></div>`;toast(t('created'));
}
function earnOf(clicks){return clicks*CONFIG.cpm/1000;}
function renderEarn(){
const L=links();const codes=Object.keys(L);
let clicks=0;codes.forEach(k=>clicks+=L[k].clicks||0);
const c=created();
document.getElementById('stLinks').textContent=c.length;
document.getElementById('stClicks').textContent=clicks;
document.getElementById('stEarn').textContent='$'+earnOf(clicks).toFixed(2);
document.getElementById('earnBody').innerHTML=codes.map(k=>{const it=L[k];
return `<tr><td class="mono">${base()}#s=${k}</td><td class="mono">${(it.url||'').slice(0,40)}</td><td>${it.clicks||0}</td><td>$${earnOf(it.clicks||0).toFixed(3)}</td><td><button onclick="delLink('${k}')" style="background:none;border:none;cursor:pointer">${t('cDel')}</button></td></tr>`;}).join('');
}
function delLink(k){const L=links();delete L[k];setLinks(L);renderEarn();}
function loadAds(){const A=CONFIG.ads;
[['adFoot'],['adGate']].forEach(([id])=>{const el=document.getElementById(id);if(!el)return;const ph=el.querySelector('.ph');
if(A.client){el.innerHTML='<ins class="adsbygoogle" style="display:block" data-ad-client="'+A.client+'" data-ad-slot="'+(A.slot||'')+'" data-ad-format="auto"></ins>';}
else if(A.carbonServe){el.innerHTML='';const s=document.createElement('script');s.async=true;s.id='_carbonads_js';s.src='//cdn.carbonads.com/carbon.js?serve='+A.carbonServe+'&placement='+A.carbonPlacement;el.appendChild(s);}});
if(CONFIG.ads.client&&!document.querySelector('script[src*="adsbygoogle"]')){const s=document.createElement('script');s.async=true;s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+CONFIG.ads.client;s.crossOrigin='anonymous';document.head.appendChild(s);try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}}
}
window.addEventListener('hashchange',route);
setLang('en');loadAds();renderEarn();route();
</script>
